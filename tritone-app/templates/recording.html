<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tritone</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/styles.css">
</head>
<body>
<input class="tab-input" type="radio" name="tab" id="tab-record" checked>
<input class="tab-input" type="radio" name="tab" id="tab-library">

<div class="app">

  <!-- Library: list of saved memos -->
  <aside class="library">
    <h1 class="brand">Tritone</h1>
    <button class="btn btn-record-new" type="button" data-rec aria-pressed="false"><span class="dot"></span><span class="rec-label">Record New</span></button>
    <label class="search"><span class="visually-hidden">Search memos</span>
      <input type="search" placeholder="Search by title"></label>
    <div class="chips" role="group" aria-label="Filter by key">
      <button class="chip is-on" type="button">All</button>
      <button class="chip" type="button">D minor</button>
      <button class="chip" type="button">C major</button>
    </div>
    <ul id="recordings" class="memos">
      <p>You have no recordings yet. Try recording something!</p>
      <!-- <li class="memo is-active">
        <button class="play" type="button" aria-label="Play Bridge idea"></button>
        <div><b>Bridge idea</b><span class="meta">Today, 4:12 PM &middot; 0:24 &middot; D min</span><span class="seq">A4 B4 C5 A4 G4</span></div>
      </li>
      <li class="memo">
        <button class="play" type="button" aria-label="Play Hook, take 2"></button>

      </li>

        <div><b>Walking bass</b><span class="meta">Oct 12 &middot; 0:38 &middot; F maj</span><span class="seq">F4 A4 C5 A4 F4</span></div>
      </li>
      <li class="memo">
        <button class="play" type="button" aria-label="Play Hum in the car"></button>
        <div><b>Hum in the car</b><span class="meta">Oct 9 &middot; 0:17 &middot; G min</span><span class="seq">G4 B4 D5 C5</span></div>
      </li> -->
    </ul>
  </aside>

  <!-- Studio: live note, pitch roll, controls -->
  <main class="studio">
    <header class="studio-head"><h2 class="title">Bridge idea</h2>
      <p class="tags"><span class="tag tag-key">D minor</span><span class="tag">0:24</span><span class="tag">~92 BPM</span></p></header>

    <section class="readout" aria-live="polite">
      <p class="status" data-status>Ready</p>
      <p class="note">G<sup>4</sup></p>
      <p class="hz">392.0 Hz &middot; +6 cents</p>
    </section>

    <div class="roll" role="img" aria-label="Pitch roll: A4 B4 C5 B4 A4 G4">
      <!-- <span class="row" style="--row:0">E5</span><span class="row" style="--row:1">D5</span>
      <span class="row" style="--row:2">C5</span><span class="row" style="--row:3">B4</span>
      <span class="row" style="--row:4">A4</span><span class="row" style="--row:5">G4</span>
      <span class="row" style="--row:6">F4</span><span class="row" style="--row:7">E4</span>
      <i class="bar" style="--row:4;--x:13;--w:10"></i>
      <i class="bar" style="--row:3;--x:25;--w:8"></i>
      <i class="bar" style="--row:2;--x:34;--w:15"></i>
      <i class="bar" style="--row:3;--x:52;--w:7"></i>
      <i class="bar" style="--row:4;--x:61;--w:17"></i>
      <i class="bar is-live" style="--row:5;--x:82;--w:10"></i>
      <i class="playhead" style="--x:94"></i> -->
    </div>
    <p class="clock"><span>Key: D minor</span><span data-clock>0:00</span></p>

    <!-- Desktop playback bar (hidden on phone) -->
    <div class="transport">
      <button class="play" type="button" aria-label="Play"></button>
      <input class="scrub" type="range" min="0" max="24" step="0.1" value="10" aria-label="Playback position">
      <span class="time">0:10 / 0:24</span>
    </div>

    <div class="controls">
      <button class="round" type="button" aria-label="Discard take">&times;</button>
      <button class="rec" type="button" data-rec aria-pressed="false" aria-label="Start recording"><span></span></button>
      <button class="round" type="button" aria-label="Metronome">&#9833;</button>
    </div>
  </main>

  <!-- Detected notes: desktop side panel -->
  <aside class="notes">
    <h2 class="label">Detected notes</h2>
    <p class="note-list">A4 &middot; B4 &middot; C5 &middot; B4 &middot; A4 &middot; G4 &middot; F4</p>
    <button class="btn btn-outline" type="button">Export MIDI</button>
    <button class="btn btn-ghost" type="button">Copy note names</button>
  </aside>
</div>

<nav class="tabbar" aria-label="Main">
  <label for="tab-record">Record</label>
  <label for="tab-library">Library</label>
  <label for="tab-record">Scales</label>
</nav>
<script src="{{ url_for('static', filename='recording.js') }}"></script>

</body>
</html>
